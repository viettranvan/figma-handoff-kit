<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Figma Handoff Kit</title>
  <style>
    /* AAP light theme snapshot; see design-tokens.md. No runtime dependency on the app. */
    :root {
      --spacing: 4px;
      --color-bg-brand-primary: var(--color-brand-50);
      --color-bg-brand-secondary: var(--color-brand-100);
      --color-bg-brand-solid: var(--color-brand-600);
      --color-bg-brand-solid_hover: var(--color-brand-700);
      --color-bg-error-primary: var(--color-red-50);
      --color-bg-primary: var(--color-white);
      --color-bg-secondary: var(--color-neutral-50);
      --color-bg-success-primary: var(--color-green-50);
      --color-bg-tertiary: var(--color-neutral-100);
      --color-blue-400: rgb(96 165 250);
      --color-border-brand: var(--color-brand-500);
      --color-border-primary: var(--color-neutral-300);
      --color-border-secondary: var(--color-neutral-200);
      --color-brand-100: rgb(231 236 244);
      --color-brand-50: rgb(243 246 251);
      --color-brand-500: rgb(67 78 93);
      --color-brand-600: rgb(32 42 56);
      --color-brand-700: rgb(18 27 40);
      --color-brand-900: rgb(6 12 22);
      --color-fg-error-primary: var(--color-red-600);
      --color-fg-success-primary: var(--color-green-600);
      --color-green-400: rgb(74 222 128);
      --color-green-50: rgb(240 253 244);
      --color-green-600: rgb(22 163 74);
      --color-green-700: rgb(21 128 61);
      --color-neutral-100: rgb(245 245 245);
      --color-neutral-200: rgb(229 229 229);
      --color-neutral-300: rgb(212 212 212);
      --color-neutral-400: rgb(163 163 163);
      --color-neutral-50: rgb(250 250 250);
      --color-neutral-600: rgb(82 82 82);
      --color-neutral-700: rgb(64 64 64);
      --color-neutral-900: rgb(23 23 23);
      --color-red-400: rgb(255 104 86);
      --color-red-50: rgb(254 242 240);
      --color-red-600: rgb(209 23 15);
      --color-red-700: rgb(178 14 8);
      --color-text-brand-primary: var(--color-brand-900);
      --color-text-brand-secondary: var(--color-brand-700);
      --color-text-error-primary: var(--color-red-600);
      --color-text-primary: var(--color-neutral-900);
      --color-text-secondary: var(--color-neutral-700);
      --color-text-tertiary: var(--color-neutral-600);
      --color-white: rgb(255 255 255);
      --font-body: var(--font-sans);
      --font-mono: ui-monospace, 'Roboto Mono', SFMono-Regular, Menlo, Monaco, Consolas,
    'Liberation Mono', 'Courier New', monospace;
      --font-sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      --font-weight-semibold: 600;
      --radius-full: 9999px;
      --radius-md: 8px;
      --radius-sm: 6px;
      --radius-xs: 4px;
      --text-sm: calc(var(--spacing) * 3.5);
      --text-xs: calc(var(--spacing) * 3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }
    body { padding: 16px; background: var(--color-bg-secondary); color: var(--color-text-primary); font-size: 13px; line-height: 1.4; }
    
    .header { margin-bottom: 12px; }
    .title { font-size: 16px; font-weight: 700; color: var(--color-text-primary); display: flex; align-items: center; gap: 6px; }
    .subtitle { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }

    .status-card {
      background: var(--color-bg-primary); border: 1px solid var(--color-border-secondary); border-radius: var(--radius-md);
      padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
    }
    .badge { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 11px; padding: 3px 8px; border-radius: var(--radius-full); }
    .badge-online { background: var(--color-bg-success-primary); color: var(--color-green-700); }
    .badge-offline { background: var(--color-bg-error-primary); color: var(--color-red-700); }

    .features-banner {
      background: var(--color-bg-brand-primary); border: 1px solid var(--color-border-brand); border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 12px;
      font-size: 11px; color: var(--color-text-brand-secondary); line-height: 1.4;
    }
    .features-banner strong { color: var(--color-text-brand-primary); }

    .scope-box {
      background: var(--color-bg-primary); border: 1px solid var(--color-border-secondary); border-radius: var(--radius-md);
      padding: 12px; margin-bottom: 12px;
    }
    .scope-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--color-text-tertiary); margin-bottom: 8px; }
    
    .radio-option {
      display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; cursor: pointer;
      padding: 6px; border-radius: var(--radius-sm); transition: background 0.1s;
    }
    .radio-option:hover { background: var(--color-bg-tertiary); }
    .radio-option input[type=\"radio\"] { margin-top: 2px; }
    .radio-title { font-weight: 600; color: var(--color-text-secondary); font-size: 12px; }
    .radio-desc { font-size: 11px; color: var(--color-text-tertiary); margin-top: 1px; }

    .control-group { margin-bottom: 12px; }
    .control-label { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 4px; display: block; }
    select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--color-border-primary); border-radius: var(--radius-sm);
      background: var(--color-bg-primary); font-size: 12px; color: var(--color-text-primary); outline: none;
    }

    button.btn-primary {
      width: 100%; padding: 10px 14px; background: var(--color-bg-brand-solid); color: var(--color-bg-primary);
      border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s;
    }
    button.btn-primary:hover:not(:disabled) { background: var(--color-bg-brand-solid_hover); }
    button.btn-primary:disabled { background: var(--color-neutral-400); cursor: not-allowed; }

    .logs-container {
      margin-top: 12px; background: var(--color-text-primary); border-radius: var(--radius-sm); padding: 10px;
      height: 180px; overflow-y: auto; font-family: var(--font-mono);
      font-size: 11px; color: var(--color-border-secondary);
    }
    .log-entry { margin-bottom: 4px; word-break: break-all; }
    .log-success { color: var(--color-green-400); }
    .log-info { color: var(--color-blue-400); }
    .log-error { color: var(--color-red-400); }

    .tip { margin-top: 10px; font-size: 11px; color: var(--color-text-tertiary); text-align: center; }
    body { font-size:13px; }
    .header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h1 { font-size:18px; }
    .language { font-size:12px; }
    .language select { width:auto; display:block; padding:6px; }
    .destination { background:white; padding:12px; border:1px solid var(--color-border-primary); border-radius:var(--radius-md); margin-bottom:12px; }
    .destination-heading { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; margin-bottom:8px; }
    #project-name, #output-directory { display:block; overflow-wrap:anywhere; }
    #output-directory { margin-top:4px; color:var(--color-text-tertiary); font-size:12px; }
    #connection-error { color:var(--color-text-error-primary); margin-top:6px; }
    .radio-desc,.scope-label,.badge,.logs-container { font-size:12px; }
    .radio-title,.control-label { font-size:13px; }
    .radio-option { min-height:44px; }
    :where(button,select,input,summary,[tabindex]):focus-visible { outline:3px solid var(--color-bg-brand-solid); outline-offset:3px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .actions button { background:white; color:var(--color-text-secondary); border:1px solid var(--color-neutral-400); padding:7px 10px; border-radius:5px; cursor:pointer; }
    summary { cursor:pointer; padding:10px 0; font-weight:600; }
    .help { color:var(--color-text-tertiary); margin-top:8px; }
    #progress { min-height:36px; padding:8px 0; }
    .logs-container { margin-top:8px; height:150px; }
    .log-entry { overflow-wrap:anywhere; word-break:normal; font-family:var(--font-mono); }
    #btn-export { margin-top:12px; }
    [hidden] { display:none !important; }
    .header { margin-bottom:16px; }
    .language-toggle { display:inline-flex; gap:6px; align-items:center; font-size:11px; font-weight:600; color:var(--color-text-tertiary); cursor:pointer; min-height:32px; position:relative; }
    .language-toggle input { position:absolute; width:100%; height:100%; opacity:0; cursor:pointer; }
    .toggle-track { width:32px; height:18px; background:var(--color-neutral-300); border-radius:12px; padding:2px; pointer-events:none; }
    .toggle-track::before { content:""; display:block; width:14px; height:14px; background:white; border-radius:50%; transition:transform .15s; }
    .language-toggle input:checked + .toggle-track { background:var(--color-bg-brand-solid); }
    .language-toggle input:checked + .toggle-track::before { transform:translateX(14px); }
    .language-toggle:has(input:focus-visible) { outline:3px solid var(--color-bg-brand-solid); outline-offset:3px; border-radius:var(--radius-xs); }
    .destination { background:transparent; padding:10px 12px; }
    .destination-heading { margin-bottom:4px; font-size:12px; color:var(--color-text-tertiary); }
    .badge-online::before { content:""; width:6px; height:6px; background:var(--color-fg-success-primary); border-radius:50%; }
    .badge-offline::before { content:""; width:6px; height:6px; background:var(--color-fg-error-primary); border-radius:50%; }
    .destination-path summary { font-size:12px; font-weight:400; padding:3px 0 0; color:var(--color-text-tertiary); }
    .scope-box { padding:12px; }
    .scope-label { font-size:11px; letter-spacing:.04em; }
    .radio-option { margin-bottom:4px; }
    .advanced { border-bottom:1px solid var(--color-border-secondary); }
    .advanced > summary,.log-panel > summary,.help > summary { font-size:12px; color:var(--color-text-tertiary); }
    .advanced .control-group { margin-top:8px; }
    .log-panel,.help { margin-top:4px; }
    .actions button { font-size:12px; padding:5px 8px; }
    @media (prefers-reduced-motion:reduce) { .toggle-track::before { transition:none; } }
    .export-options { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin:8px 0 12px; }
    .scale-options { border:0; display:flex; gap:8px; align-items:center; min-width:0; }
    .scale-options legend { float:left; font-size:12px; color:var(--color-text-tertiary); margin-right:8px; padding:8px 0; }
    .segments { display:flex; border:1px solid var(--color-border-primary); border-radius:var(--radius-sm); overflow:hidden; }
    .segments label { position:relative; cursor:pointer; }
    .segments input { position:absolute; opacity:0; width:100%; height:100%; }
    .segments span { display:block; padding:8px 12px; font-size:12px; background:white; }
    .segments input:checked + span { background:var(--color-bg-brand-secondary); color:var(--color-bg-brand-solid_hover); font-weight:700; }
    .segments input:focus-visible + span { box-shadow:inset 0 0 0 2px var(--color-bg-brand-solid); }
    .segments input:disabled + span { opacity:.5; cursor:not-allowed; }
    .force-toggle { position:relative; display:flex; gap:8px; align-items:center; min-height:36px; font-size:12px; cursor:pointer; color:var(--color-text-tertiary); }
    .force-toggle input { position:absolute; right:0; width:32px; height:24px; opacity:0; }
    .force-toggle input:checked + .toggle-track { background:var(--color-bg-brand-solid); }
    .force-toggle input:checked + .toggle-track::before { transform:translateX(14px); }
    .force-toggle:has(input:focus-visible) { outline:2px solid var(--color-bg-brand-solid); outline-offset:3px; border-radius:var(--radius-xs); }
    .force-toggle input:disabled + .toggle-track { opacity:.5; }
    .actions .icon-button { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; background:transparent; border-color:transparent; }
    .actions .icon-button:hover { background:var(--color-border-secondary); }

    .logs-container { background:var(--color-neutral-900); color:var(--color-neutral-200); }
    .segments span { background:var(--color-bg-primary); }
    .toggle-track::before { background:var(--color-white); }
    .log-panel { margin-top:12px; border:1px solid var(--color-border-secondary); border-radius:var(--radius-sm); }
    .log-toolbar { position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 8px; background:var(--color-bg-secondary); border-radius:var(--radius-sm) var(--radius-sm) 0 0; }
    .log-toolbar strong { font-size:12px; color:var(--color-text-secondary); }
    .log-toolbar .actions { margin:0; flex-wrap:nowrap; }
    .log-panel .logs-container { margin-top:0; border-radius:0 0 var(--radius-sm) var(--radius-sm); }
    .help-steps { padding:0 0 0 20px; margin:4px 0 12px; }
    .help-steps li { padding:4px 0; }
    .help-steps code { display:block; padding:8px; margin-top:6px; background:var(--color-bg-tertiary); border-radius:var(--radius-xs); user-select:all; }
    .storage-note { padding:10px; background:var(--color-bg-brand-primary); border-radius:var(--radius-sm); }
    .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:10; max-width:calc(100% - 32px); padding:10px 16px; background:var(--color-neutral-900); color:var(--color-white); border-radius:var(--radius-md); box-shadow:0 4px 16px #0003; font-size:13px; }
    dialog { margin:auto; padding:20px; width:calc(100% - 32px); max-width:440px; border:1px solid var(--color-border-primary); border-radius:var(--radius-md); background:var(--color-bg-primary); color:var(--color-text-primary); }
    dialog::backdrop { background:#0006; }
    dialog h2 { font-size:16px; margin-bottom:8px; }
    dialog textarea { width:100%; height:180px; margin:12px 0; padding:8px; font-family:var(--font-mono); }
    dialog button { padding:8px 16px; cursor:pointer; }
    .help { margin-top:12px; border-top:1px solid var(--color-border-secondary); padding-top:4px; }
    .help-steps { list-style:none; counter-reset:setup; margin:6px 0 12px; padding:0; }
    .help-steps li { counter-increment:setup; position:relative; padding:6px 0 12px 34px; }
    .help-steps li::before { content:counter(setup); position:absolute; left:0; top:6px; width:24px; height:24px; display:grid; place-items:center; border-radius:50%; background:var(--color-bg-brand-secondary); color:var(--color-text-brand-secondary); font-size:12px; font-weight:600; }
    .help-steps strong { display:block; font-size:13px; line-height:1.5; color:var(--color-text-primary); }
    .help-steps p { margin-top:3px; font-size:12px; line-height:1.65; color:var(--color-text-tertiary); }
    .help-steps code { font-family:var(--font-mono); font-size:12px; border:1px solid var(--color-border-secondary); background:var(--color-bg-primary); padding:9px 12px; }
    .storage-note { font-size:12px; line-height:1.65; padding:8px 0; background:transparent; border-top:1px solid var(--color-border-secondary); color:var(--color-text-tertiary); }
    .destination { position:relative; }
    .destination-heading { padding-right:38px; min-height:28px; align-items:center; }
    .retry-action { position:absolute; right:8px; top:8px; margin:0; }
    #connection-actions { display:flex; align-items:center; justify-content:space-between; background:var(--color-bg-tertiary); border:1px solid var(--color-border-secondary); border-radius:var(--radius-sm); padding:4px 6px 4px 10px; margin-top:10px; }
    #connection-actions code { font-family:var(--font-mono); font-size:12px; user-select:all; }
    #connection-error { font-size:12px; line-height:1.6; color:var(--color-text-secondary); }
    .icon-button { position:relative; }
    .icon-button::after { content:attr(data-tooltip); position:absolute; right:0; bottom:calc(100% + 6px); z-index:20; width:max-content; max-width:240px; white-space:normal; text-align:left; padding:6px 9px; font-size:12px; line-height:1.4; border-radius:var(--radius-xs); background:var(--color-neutral-900); color:var(--color-white); box-shadow:0 2px 8px #0003; opacity:0; visibility:hidden; pointer-events:none; }
    .icon-button:hover::after,.icon-button:focus-visible::after { opacity:1; visibility:visible; }
    .retry-action .icon-button::after { bottom:auto; top:calc(100% + 6px); }
    .help-command { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px; padding:4px 6px 4px 10px; background:var(--color-bg-primary); border:1px solid var(--color-border-secondary); border-radius:var(--radius-sm); }
    .help-command code { display:block; margin:0; padding:0; border:0; background:transparent; font-family:var(--font-mono); font-size:12px; overflow-wrap:anywhere; user-select:all; }
    .help-command .icon-button { display:inline-flex; flex-shrink:0; align-items:center; justify-content:center; width:32px; height:32px; padding:0; border:0; border-radius:var(--radius-xs); background:transparent; color:var(--color-text-secondary); cursor:pointer; }
    .help-command .icon-button:hover { background:var(--color-bg-tertiary); }
    .help-steps { margin-bottom:8px; }
    .help-steps li { padding-bottom:10px; }
    .scope-label { text-transform:none; letter-spacing:0; font-size:13px; color:var(--color-text-primary); }
    .export-options { display:grid; grid-template-columns:1fr; gap:5px; margin-bottom:0; }
    .scale-options { display:flex; align-items:center; }
    .scale-options legend { margin-right:auto; }
    .force-toggle { justify-content:space-between; margin-top:8px; font-size:13px; color:var(--color-text-secondary); }
    .option-hint { font-size:12px; line-height:1.5; color:var(--color-text-tertiary); margin:2px 0 6px; }
    .scope-label { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .help-trigger,.popover-header .icon-button { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:0; border-radius:var(--radius-xs); background:transparent; color:var(--color-text-tertiary); cursor:pointer; }
    .help-trigger:hover,.popover-header .icon-button:hover { background:var(--color-bg-tertiary); }
    #options-help { position:fixed; inset:0; margin:auto; width:calc(100% - 32px); max-width:400px; max-height:calc(100% - 48px); overflow-y:auto; padding:14px; border:1px solid var(--color-border-primary); border-radius:var(--radius-md); background:var(--color-bg-primary); color:var(--color-text-primary); box-shadow:0 8px 30px #0003; }
    .popover-header { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    #options-help dt { margin-top:12px; font-size:13px; font-weight:600; }
    #options-help dd { margin:4px 0 0; font-size:12px; line-height:1.65; color:var(--color-text-secondary); }
    body { padding:14px; line-height:1.5; }
    .header { margin-bottom:14px; }
    .destination { padding:10px 12px; margin-bottom:12px; }
    .scope-box { padding:10px; margin-bottom:8px; }
    .scope-label { padding:0 2px; margin-bottom:4px; font-weight:600; }
    .radio-option { padding:9px 10px; margin-bottom:3px; border:1px solid transparent; gap:10px; }
    .radio-option:has(input:checked) { background:var(--color-bg-brand-primary); border-color:var(--color-border-secondary); }
    .radio-option input { flex-shrink:0; margin-top:4px; accent-color:var(--color-bg-brand-solid); }
    .radio-option > div { min-width:0; }
    .radio-title { font-size:13px; line-height:1.5; overflow-wrap:anywhere; font-weight:500; }
    .radio-option:has(input:checked) .radio-title { font-weight:600; }
    .radio-desc { line-height:1.5; margin-top:2px; color:var(--color-text-tertiary); }
    .export-options { background:var(--color-bg-primary); border:1px solid var(--color-border-secondary); border-radius:var(--radius-md); padding:0 12px; gap:0; margin-top:10px; }
    .scale-options { min-height:46px; }
    .scale-options legend { padding:0; font-size:12px; }
    .segments span { padding:6px 11px; }
    .force-toggle { margin:0; min-height:46px; border-top:1px solid var(--color-border-secondary); font-size:12px; }
    #force-hint:not([hidden]) { margin:6px 2px; }
    #btn-export { min-height:40px; }
    #options-help { padding:0; max-width:380px; box-shadow:0 12px 36px #0003; }
    #options-help::backdrop { background:rgb(0 0 0 / .12); }
    .popover-header { position:sticky; top:0; padding:12px 16px; background:var(--color-bg-primary); border-bottom:1px solid var(--color-border-secondary); }
    .popover-header > strong { font-size:14px; }
    .explain-section { margin:0 16px; padding:14px 0; }
    .explain-section + .explain-section { border-top:1px solid var(--color-border-secondary); }
    .explain-section h3 { font-size:13px; margin-bottom:8px; }
    .explain-section p { font-size:12px; line-height:1.65; color:var(--color-text-secondary); }
    .explain-list { list-style:none; padding:0; display:grid; gap:10px; }
    .explain-list li { display:grid; grid-template-columns:100px 1fr; gap:10px; font-size:12px; line-height:1.6; }
    .explain-list strong { font-weight:500; color:var(--color-text-primary); }
    .explain-list span { color:var(--color-text-tertiary); }
    .scale-explainer { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .scale-explainer > div { display:flex; flex-direction:column; gap:3px; padding:8px; background:var(--color-bg-secondary); border-radius:var(--radius-sm); }
    .scale-explainer strong { font-size:13px; }
    .scale-explainer span { font-size:12px; color:var(--color-text-tertiary); }
    .explain-warning { margin-top:8px; padding:8px 10px; background:var(--color-bg-brand-primary); border-radius:var(--radius-sm); }
    /* Compact controls: one hierarchy, minimal decoration. */
    .destination { background:transparent; border:0; border-bottom:1px solid var(--color-border-secondary); border-radius:0; padding:0 0 12px; }
    .retry-action { top:0; right:0; }
    .scope-box { border:0; background:transparent; padding:0; }
    .scope-label { margin-bottom:2px; }
    .radio-option { padding:7px 8px; }
    .radio-option:has(input:checked) { border-color:transparent; }
    .export-options { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; border:0; border-top:1px solid var(--color-border-secondary); border-radius:0; padding:8px 0 0; background:transparent; margin-top:8px; }

      }
      // Figma iframe environments may not expose the secure-context randomUUID API.
      activeRunId = `export-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      exportDelivery = delivery;
      zipFiles.clear();
      if (zipURL) { URL.revokeObjectURL(zipURL); zipURL = null; }
      document.getElementById("zip-download").hidden = true;
      isExporting = true;
      stats.checked = stats.saved = stats.skipped = 0;
      phase = "checking";
      renderProgress();
      setControlsDisabled(true);
      btnExport.disabled = true;
      const scope = fromSync ? "all_pages" : getSelectedScope();
      const scale = fromSync ? 2 : Number(document.querySelector("input[name=scale]:checked").value);
      addLog(`🚀 Bắt đầu xuất theo chế độ: [${scope}]... Vui lòng không đóng cửa sổ Figma.`, "info");
      exportProjectId = projectId;
      parent.postMessage({ pluginMessage: { type: "START_EXPORT", runId: activeRunId, scope: scope, scale: scale, force: fromSync ? false : document.getElementById("force-export").checked } }, "*");
    };
    btnExport.onclick = event => { if(event.isTrusted) startExport(); };
    parent.postMessage({pluginMessage:{type:'GET_DOCUMENT'}},'*');
    document.getElementById('allow-sync').onchange = async event => {
      if(!event.target.checked) { await disableSync(); return; }
      try {
        if(!documentId || !isServerOnline || delivery!=='local') throw new Error(words('Chọn lưu vào project và kết nối trước.','Connect to a project first.'));
        const paired=await syncRequest('/sync/pair');syncToken=paired.token;
      } catch(error) {event.target.checked=false;toast(error.message);}
    };
    let syncPolling=false;
    setInterval(async()=>{
      if(!syncToken || syncPolling || delivery!=='local') return;
      syncPolling=true;
      try { const result=await syncRequest('/sync/poll'); if(result.job) { if(isExporting) await syncRequest('/sync/result',{jobId:result.job.id,error:'Plugin is already exporting; retry after it finishes.'}); else {syncJob=result.job.id;startExport(true);} } }
      catch(error) {syncToken=null;document.getElementById('allow-sync').checked=false;toast(error.message);}
      finally {syncPolling=false;}
    },2000);
  </script>
</body>
</html>
